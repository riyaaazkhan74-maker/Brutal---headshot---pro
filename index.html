<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#111111">
<title>Brutal Headshot Pro — Training Arena</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif;touch-action:manipulation}
header{text-align:center;padding:18px 10px 12px;background:linear-gradient(180deg,#241010,#090909);border-bottom:1px solid #6f1717}
h1{margin:0;color:#ff3434;font-size:25px;letter-spacing:1.5px} .sub{font-size:11px;color:#aaa;letter-spacing:2px;margin-top:5px}
.stats{display:flex;justify-content:space-around;padding:12px 5px;background:#151515;font-weight:bold}
.stats span{color:#ff4545}.arena{position:relative;margin:14px auto;width:calc(100% - 24px);height:min(60vh,520px);min-height:340px;background:radial-gradient(circle at center,#292929,#101010 70%);border:2px solid #6b1b1b;border-radius:16px;overflow:hidden}
.arena:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:32px 32px;pointer-events:none}
.target{position:absolute;width:62px;height:62px;border-radius:50%;border:3px solid #ff4545;background:radial-gradient(circle,#fff 0 8%,#ff4545 10% 28%,#171717 31% 48%,#ff4545 51% 58%,#222 61%);box-shadow:0 0 18px #ff252599;display:grid;place-items:center;cursor:pointer;user-select:none}
.target:after{content:"";width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 8px white}
.controls{display:flex;gap:10px;padding:0 12px 14px}.controls button{flex:1;border:0;border-radius:10px;padding:14px 8px;background:#b51e1e;color:white;font-weight:bold;font-size:14px}.controls button.secondary{background:#292929;border:1px solid #555}
.note{text-align:center;color:#aaa;font-size:12px;padding:0 18px 20px;line-height:1.5}.message{text-align:center;color:#ff7777;min-height:20px;font-weight:bold}
</style>
</head>
<body>
<header><h1>BRUTAL HEADSHOT PRO</h1><div class="sub">AIM TRAINING ARENA • PRACTICE ONLY</div></header>
<div class="stats"><div>SCORE: <span id="score">0</span></div><div>TIME: <span id="time">30</span>s</div><div>HITS: <span id="hits">0</span></div></div>
<div class="arena" id="arena" aria-label="Training area"></div>
<div class="message" id="message">Tap START, then hit the moving targets!</div>
<div class="controls"><button id="start">START TRAINING</button><button class="secondary" id="reset">RESET</button></div>
<div class="note">Tap the moving targets as quickly as you can. This is a standalone reaction and aim-practice game; it does not connect to or modify Free Fire MAX.</div>
<script>
const arena=document.getElementById('arena'), scoreEl=document.getElementById('score'), timeEl=document.getElementById('time'), hitsEl=document.getElementById('hits'), msg=document.getElementById('message');
let score=0,hits=0,time=30,running=false,timer=null,mover=null,target=null,x=40,y=50,vx=2.2,vy=1.7;
function placeTarget(){
 if(target) target.remove();
 target=document.createElement('button'); target.className='target'; target.setAttribute('aria-label','Tap target');
 target.style.left='40%';target.style.top='40%';arena.appendChild(target);
 x=Math.random()*Math.max(1,arena.clientWidth-70); y=Math.random()*Math.max(1,arena.clientHeight-70);
 vx=(Math.random()>.5?1:-1)*(2+Math.random()*2); vy=(Math.random()>.5?1:-1)*(1.5+Math.random()*2);
 target.addEventListener('pointerdown',e=>{e.preventDefault();if(!running)return;score+=10;hits++;scoreEl.textContent=score;hitsEl.textContent=hits;msg.textContent='NICE HIT! +10';placeTarget();});
}
function move(){if(!running||!target)return;const maxX=arena.clientWidth-62,maxY=arena.clientHeight-62;x+=vx;y+=vy;if(x<0||x>maxX)vx*=-1;if(y<0||y>maxY)vy*=-1;target.style.left=Math.max(0,Math.min(maxX,x))+'px';target.style.top=Math.max(0,Math.min(maxY,y))+'px';}
function end(){running=false;clearInterval(timer);clearInterval(mover);if(target)target.remove();target=null;msg.textContent='TIME UP! Final score: '+score;}
document.getElementById('start').onclick=()=>{if(running)return;score=0;hits=0;time=30;scoreEl.textContent=0;hitsEl.textContent=0;timeEl.textContent=30;running=true;msg.textContent='GO! Hit the targets!';placeTarget();mover=setInterval(move,16);timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)end();},1000);};
document.getElementById('reset').onclick=()=>{end();score=0;hits=0;time=30;scoreEl.textContent=0;hitsEl.textContent=0;timeEl.textContent=30;msg.textContent='Ready when you are.';};
</script>
</body></html>
